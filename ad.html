<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Singit – Complete the Lyric</title>
<style>
/* ==== Tokens from Figma "Full Flow and Analysis" → Translate the word ==== */
:root{
  --primary:#5B8CF4; --primary-d:#3F6FD6; --ink:#1B1E3D; --muted:#9AA0B4;
  --line:#E5E7EE; --track:#E9ECF3; --purple:#B651E0; --tag-bg:#FBEAFB;
  --good:#3BC46B; --good-bg:#E7F8EC; --bad:#F2475B; --bad-bg:#FDE9EC; --heart:#F2475B;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;color:var(--ink);
  font-family:Nunito,"Nunito Sans","Segoe UI Rounded","SF Pro Rounded",system-ui,sans-serif;user-select:none}
#stage{position:relative;width:100%;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:#fff}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px;overflow:hidden;transition:opacity .3s ease,transform .3s ease}
.hide{opacity:0;pointer-events:none;transform:translateY(8px)}
.char svg{display:block;width:100%;height:auto}

/* ---------- header (gear · progress · hearts) ---------- */
.hdr{display:flex;align-items:center;gap:12px;height:44px}
.gear{width:36px;height:36px;border-radius:50%;background:#F1F2F6;display:grid;place-items:center;flex:none}
.bar{flex:1;height:14px;border-radius:20px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:6%;border-radius:20px;background:var(--primary);transition:width .1s linear}
.hearts{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16px}
.hearts svg{transition:transform .25s}
.hearts.hit svg{animation:hit .4s}
@keyframes hit{30%{transform:scale(1.35)}60%{transform:scale(.85)}}

.tag{align-self:flex-start;margin-top:14px;display:inline-flex;align-items:center;gap:6px;background:var(--tag-bg);color:var(--purple);
  font-weight:800;font-size:12px;letter-spacing:-.2px;text-transform:uppercase;padding:6px 10px;border-radius:8px}
h1{font-size:24px;font-weight:800;line-height:1.2;margin-top:12px}

/* ---------- character + speech bubble ---------- */
.scene{display:flex;align-items:flex-start;gap:4px;margin-top:14px}
.scene .char{width:104px;flex:none;transform-origin:50% 90%;animation:bop .6s ease-in-out infinite alternate}
@keyframes bop{to{transform:translateY(-3px) rotate(-2deg)}}
.bubble{position:relative;margin-top:14px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;
  display:flex;align-items:center;gap:8px;box-shadow:0 2px 0 var(--line)}
.bubble:before{content:"";position:absolute;left:-9px;top:16px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .meta{font-size:12px;color:var(--muted);font-weight:700;line-height:1.2}
.bubble .meta b{display:block;color:var(--purple);font-size:15px;font-weight:800}
.eq{display:flex;align-items:flex-end;gap:2px;height:18px}
.eq i{width:3px;height:30%;background:var(--primary);border-radius:2px}
.playing .eq i{animation:eq .5s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.08s}
@keyframes eq{to{height:100%}}

/* ---------- lyric card ---------- */
.lyric{margin-top:18px;border:2px solid var(--line);border-radius:18px;padding:16px 16px;font-size:20px;font-weight:800;line-height:1.7;min-height:118px}
.lyric .ln{display:block;opacity:.35;transition:opacity .3s}
.lyric .ln.on{opacity:1}
.blank{display:inline-block;min-width:74px;text-align:center;border-bottom:3px solid var(--line);color:transparent;line-height:1.2;margin:0 2px;transition:border-color .2s}
.blank.cur{border-color:var(--primary);animation:blink 1s infinite}
.blank.ok{color:var(--primary);border-color:var(--primary);animation:pop .35s}
.blank.no{animation:shake .35s}
@keyframes blink{50%{border-color:#C9D7FB}}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- answers (Figma Button: 2px border, r18, 56px) ---------- */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.opt{height:56px;border:2px solid var(--line);border-radius:18px;background:#fff;font:inherit;font-size:18px;font-weight:700;color:var(--ink);
  box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default}
.check{margin-top:16px;height:52px;border-radius:14px;border:none;font:inherit;font-weight:800;font-size:16px;letter-spacing:.3px;text-transform:uppercase;
  background:#EBECEF;color:#B6B9C3}

/* feedback sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;padding:18px 16px 22px;border-radius:20px 20px 0 0;font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px;
  transform:translateY(110%);transition:transform .25s ease}
.sheet.show{transform:none}
.sheet.ok{background:var(--good-bg);color:var(--good)}
.sheet.no{background:var(--bad-bg);color:var(--bad)}

/* ---------- intro / end ---------- */
.center{align-items:center;justify-content:center;text-align:center}
.logo{color:var(--primary);line-height:0}
.logo svg{width:96px;height:auto}
.center .char{width:150px;margin:18px 0 8px}
.center h2{font-size:26px;font-weight:800;line-height:1.2}
.center p{color:var(--muted);font-weight:700;margin-top:8px;font-size:15px}
.btn{width:100%;height:56px;border:none;border-radius:16px;background:var(--primary);color:#fff;font:inherit;font-weight:800;font-size:18px;
  text-transform:uppercase;letter-spacing:.3px;box-shadow:0 4px 0 var(--primary-d);cursor:pointer;margin-top:28px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-d)}
.btn.pulse{animation:breathe 1.3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03)}}
.song-chip{display:inline-flex;align-items:center;gap:8px;margin-top:16px;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px}
.song-chip span{color:var(--muted);font-weight:700}
.stars{font-size:34px;color:#FFC233;letter-spacing:4px;margin-top:4px}
canvas#fx{position:absolute;inset:0;pointer-events:none}
</style>
</head>

  function pad(fr,t,d){ fr.forEach(function(f){ var o=actx.createOscillator(),g=actx.createGain(); o.type="triangle"; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.05,t+.2); g.gain.linearRampToValueAtTime(0,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d); }); }
  function sfx(ok){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    var t=actx.currentTime; (ok?[659,880,1175]:[220,180]).forEach(function(f,i){ var o=actx.createOscillator(),g=actx.createGain(); o.type=ok?"sine":"square"; o.frequency.value=f; env(g,t+i*.07,.005,.18,ok?.18:.08); o.connect(g).connect(actx.destination); o.start(t+i*.07); o.stop(t+i*.07+.25); }); }
  function stopAudio(){ if (beat) clearInterval(beat); if (audio){ var a=audio, v=1, f=setInterval(function(){ v-=.1; a.volume=Math.max(v,0); if (v<=0){ a.pause(); clearInterval(f); } },60); } }

  /* ---------- flow ---------- */
  function show(id){ ["intro","game","end"].forEach(function(s){ $(s).classList.toggle("hide", s!==id); }); }

  $("startBtn").addEventListener("click", function(){
    startAudio(); $("scene").classList.add("playing"); show("game");
    t0 = Date.now(); timerId = setInterval(tick, 100); renderBlank();
  });

  // progress bar doubles as the 15s timer
  function tick(){
    var p = Math.min(1, (Date.now()-t0)/1000/CONFIG.totalSeconds);
    $("bar").style.width = (6 + p*94) + "%";
    if (p >= 1) finish();
  }

  function renderBlank(){
    locked = false;
    var cur = blankEls[bi], opts = $("opts");
    blankEls.forEach(function(b,i){ b.el.classList.toggle("cur", i===bi); });
    lineEls.forEach(function(l){ l.classList.toggle("on", l===cur.line || l.querySelector(".ok")); });
    opts.innerHTML = "";
    CONFIG.blanks[bi].options.forEach(function(o){
      var b = document.createElement("button"); b.className = "opt"; b.textContent = o;
      b.addEventListener("click", function(){ pick(b, o); });
      opts.appendChild(b);
    });
  }

  function pick(btn, val){
    if (locked || ended) return;
    var cur = blankEls[bi];
    if (val === CONFIG.blanks[bi].answer){
      locked = true; sfx(true);
      btn.classList.add("ok"); cur.el.textContent = val; cur.el.classList.remove("cur"); cur.el.classList.add("ok");
      sheet("ok", ["Nice!","Great ear!","Perfect!","You nailed it!"][bi%4]); burst(.5);
      setTimeout(function(){ hideSheet(); bi++; if (bi < blankEls.length) renderBlank(); else finish(); }, 750);
    } else {
      sfx(false); mistakes++; btn.classList.add("no"); btn.disabled = true;
      cur.el.classList.remove("no"); void cur.el.offsetWidth; cur.el.classList.add("no");
      if (lives > 1){ lives--; $("lives").textContent = lives; var h=$("hearts"); h.classList.remove("hit"); void h.offsetWidth; h.classList.add("hit"); }
    }
  }

  function sheet(kind, txt){ var s=$("sheet"); s.className = "sheet show " + kind; s.textContent = (kind==="ok" ? "✔  " : "✖  ") + txt; }
  function hideSheet(){ $("sheet").className = "sheet"; }

  function finish(){
    if (ended) return; ended = true;
    clearInterval(timerId); stopAudio(); $("scene").classList.remove("playing");
    var done = bi >= blankEls.length, stars = !done ? 1 : mistakes === 0 ? 3 : mistakes < 3 ? 2 : 1;
    $("stars").textContent = "★".repeat(stars) + "☆".repeat(3-stars);
    $("endTitle").innerHTML = done ? "You've got an ear<br>for English!" : "So close!<br>Finish the song in Singit";
    setTimeout(function(){ show("end"); if (done) setTimeout(function(){ burst(1); }, 250); }, done ? 150 : 0);
  }

  /* ---------- CTA (MRAID-aware) ---------- */
  $("ctaBtn").addEventListener("click", function(){
    var url = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? CONFIG.storeUrls.ios : CONFIG.storeUrls.android;
    if (window.mraid && mraid.open) mraid.open(url);
    else if (window.ExitApi && ExitApi.exit) ExitApi.exit(); // Google Ads
    else window.open(url, "_blank");
  });

  /* ---------- confetti ---------- */
  var cv = $("fx"), cx = cv.getContext("2d"), parts = [], running = false;
  function size(){ cv.width = cv.offsetWidth*devicePixelRatio; cv.height = cv.offsetHeight*devicePixelRatio; }
  size(); addEventListener("resize", size);
  function burst(k){
    var cols = ["#5B8CF4","#B651E0","#3BC46B","#FFC233","#F2475B"], W = cv.width, H = cv.height;
    for (var i=0;i<70*k;i++) parts.push({x:W/2,y:H*.4,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.025-H*.005,s:(4+Math.random()*6)*devicePixelRatio,c:cols[i%5],r:Math.random()*6,life:55+Math.random()*30});
    if (!running){ running = true; loop(); }
  }
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts = parts.filter(function(p){ return p.life-- > 0; });
    parts.forEach(function(p){ p.vy += cv.height*.0009; p.x += p.vx; p.y += p.vy; p.r += .2;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.min(1,p.life/30); cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore(); });
    if (parts.length) requestAnimationFrame(loop); else running = false;
  }
})();
</script>
</body>
